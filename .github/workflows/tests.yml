# CI for the strip branch. Runs the standard tier (unit + comparator
# self-tests + step-2 end-to-end) in numeric-comparison mode: the committed
# goldens were generated on macOS, so byte comparison is not valid on the
# ubuntu runners — parsed tables at 1e-5 relative tolerance are (they absorb
# platform float noise while catching real drift; see tests/testthat/helper-saige.R).
# The full tier (step-1 regeneration, determinism, negative control) is
# same-platform only and stays local: bash harness/run_tests.sh full
#
# PGEN support (Phase 7) needs pgenlib (plink-ng) compiled into
# .pixi/envs/default/lib/libplink2_includes.a; harness/build.sh fetches and
# builds it if missing, so the install step below runs that script rather
# than a bare `R CMD INSTALL .`. The plink-ng archive+compile step is cached
# across runs (keyed on the pinned version) since runners are ephemeral and
# harness/build.sh's own guard only helps within a single run.
#
# NOTE: authored offline; not yet exercised on an actual runner.
name: tests
on:
  push:
    branches: [strip]
  pull_request:
    branches: [strip]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.51.0
          cache: false # pixi.lock is deliberately not committed (see .gitignore)
      - name: Install environment
        run: |
          pixi install
          pixi run Rscript -e 'install.packages("lintools", repos="https://cloud.r-project.org")'
      - name: Cache plink-ng build
        uses: actions/cache@v4
        with:
          # BOTH the archive and the headers: src/Makevars compiles every source
          # file with -I../plink-ng/2.0/include, so restoring the .a alone gives a
          # build that fails on "pgenlib_read.h: No such file or directory".
          # harness/build.sh now guards the two independently as well, so a
          # partial restore self-heals rather than failing.
          path: |
            .pixi/envs/default/lib/libplink2_includes.a
            plink-ng/2.0/include
          key: plink-ng-v2.0.0-a.6.16-${{ runner.os }}
      - name: Build and install SAIGE
        # No warning-count ratchet here (harness/warnings-baseline.txt is a
        # local-clang number; this is conda GCC on ubuntu, unpinned). Instead
        # the bug-shaped classes become errors. -Werror=parentheses was tried
        # in run 34836628887 and REMOVED: GCC applies it inside
        # boost/mpl/assert.hpp (a BH header R passes with -I, not -isystem),
        # which no change to this repo can silence; it also named
        # SAIGE_fitGLMM_fast.cpp:1179 (`|` around comparisons), a site clang's
        # -Wparentheses does not flag. If -Wuninitialized fires on the two
        # enumeration-guarded sites of LEDGER #152, drop that flag here rather
        # than touching the code.
        env:
          SAIGE_WARNINGS_RATCHET: "0"
          SAIGE_EXTRA_CXXFLAGS: "-Werror=uninitialized -Werror=return-type"
        run: bash harness/build.sh
      - name: Run tests (standard tier, numeric compare)
        run: SAIGE_COMPARE_MODE=numeric bash harness/run_tests.sh standard
