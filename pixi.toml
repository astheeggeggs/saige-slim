[workspace]
channels = ["conda-forge", "bioconda"]
name = "SAIGE"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
boost-cpp = "*"
# libdeflate/zlib/zstd: headers+libs plink-ng's build needs (harness/build.sh,
# docker/Dockerfile). Explicit rather than relying on another package pulling
# them in transitively -- that's exactly what silently differed between
# platforms and broke the Linux CI build (zlib.h present on macOS via a
# transitive dep, absent on linux-64's resolution of the same lockfile-less
# `pixi install`). `main` pinned zlib/zstd explicitly for the same reason.
libdeflate = "*"
openblas = "*"
r = "*"
r-bh = "*"
r-cpp11 = "*"
r-devtools = "*"
# Documentation tooling (harness/docs.sh, .github/workflows/docs.yml). All
# five already arrive transitively through r-devtools; pinned so a devtools
# change cannot silently drop one. Not in `runtime`: the release image
# carries no documentation tooling.
r-jsonlite = "*"
r-knitr = "*"
r-pkgdown = "*"
r-rmarkdown = "*"
r-roxygen2 = "*"
r-rprojroot = "*"
r-rcpparmadillo = "*"
r-rcppparallel = "*"
"r-data.table" = "*"
r-optparse = "*"
r-rhpcblasctl = "*"
r-skat = "*"
r-testthat = "*"
superlu = "*"
tbb = "*"
zlib = "*"
zstd = "*"

# plink2 is used only to generate PGEN/pvar/psam test fixtures (harness/
# make_goldens.sh), never by the installed R package. bioconda ships no
# osx-arm64 build, so it is restricted to the platforms that have one.
[target.linux-64.dependencies]
plink2 = "*"

[target.osx-64.dependencies]
plink2 = "*"

# The RUNTIME environment: what the INSTALLED package and the four CLI
# scripts need and nothing else -- no compilers, no devtools/testthat, no
# plink2, no Boost (headers, build-time only). docker/Dockerfile's runtime
# stage copies exactly this tree; the build stage still uses `default`
# (src/Makevars hardcodes its include and lib paths). Keep the R pin equal
# in both: an .so built against one R and loaded by another is undefined.
[feature.runtime.dependencies]
openblas = "*"
r-base = "*"
r-rcpp = "*"
r-rcpparmadillo = "*"
r-rcppparallel = "*"
r-matrix = "*"
"r-data.table" = "*"
r-optparse = "*"
r-rhpcblasctl = "*"
r-skat = "*"
superlu = "*"
tbb = "*"
libdeflate = "*"
zlib = "*"
zstd = "*"

[environments]
default = { solve-group = "main" }
# no-default-feature: without it an environment ALSO carries the default
# feature, and the first image measured 2.0 GB of devtools/testthat/plink2.
runtime = { features = ["runtime"], solve-group = "main", no-default-feature = true }
